<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Idesign — Production-Grade Vue 3 & Nuxt 3 Component System</title>
  <meta name="description"
    content="Copy-pasteable, installable Vue 3 & Nuxt 3 UI components built on the Liquid Glass visual language." />
  <meta property="og:title" content="Idesign — Production-Grade Vue 3 & Nuxt 3 Component System" />
  <meta property="og:description"
    content="Copy-pasteable, installable Vue 3 & Nuxt 3 UI components built on the Liquid Glass visual language." />
  <meta property="og:image" content="/icon.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/icon.png" />
  <!-- System UI Font Fallbacks and Inter Font for standard web rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script>
    (function () {
      var saved = localStorage.getItem('idesign_dark');
      var isDark = saved !== null ? saved === 'true' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      } else {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
